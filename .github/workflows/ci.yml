name: Routes App CI

# Run manually only to avoid consuming GitHub Actions minutes on every PR/push.
on:
  workflow_dispatch:

concurrency:
  group: routes-app-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify routes app workspace
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run workspace checks
        run: npm run check:workspace

      - name: Run lint
        run: npm run lint

      - name: Run native release preflight
        run: npm run check:native-release

      - name: Render non-secret release evidence seed
        run: npm run release:evidence:seed

      - name: Build exported app bundles
        run: npm run build

      - name: Verify bounded host-security patches and preserve raw audit
        run: |
          npm run verify:host-security -- \
            --source-sha "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/host-security-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

      - name: Validate and summarize host-security evidence
        if: always()
        run: node scripts/report-host-security.mjs "$RUNNER_TEMP/host-security-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

      - name: Upload host-security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-security-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/host-security-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error

      - name: Check Expo dependency alignment against installed SDK
        run: EXPO_OFFLINE=1 npx expo install --check

      - name: Check git diff whitespace
        run: git diff --check
